# Developer services. `docker compose up -d redis` is the only thing the
# current phase needs; Postgres lands with the persistence phase.
services:
  redis:
    image: redis:7-alpine
    # 6379 sits inside a Windows excluded-port range on some dev machines;
    # 6380 is the documented dev fallback (CI still uses 6379).
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
