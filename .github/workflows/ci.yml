name: CI

# Phase gate: grows per roadmap phase (docs/roadmap.md#ci-gates).
# Current: repo integrity + typecheck + unit/property tests + Rego
# (fmt/check/native tests) + Wasm build + manifest hash verification +
# Wasm runtime tests + Redis-backed replay integration (real Redis via
# service container — no mocks) + key-material scan.

on:
  push:
    branches: [main]
  pull_request:

env:
  OPA_VERSION: v1.20.2

jobs:
  gate:
    name: Typecheck + tests + Rego/Wasm + Redis integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned OPA (${{ env.OPA_VERSION }})
        run: |
          curl -sL -o /tmp/opa https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Rego fmt
        run: opa fmt --fail policies/

      - name: Rego check
        run: opa check policies/

      - name: Rego native tests
        run: opa test --fail-on-empty policies/

      - name: Verify policy artifact integrity (wasm hash + Rego source binding)
        # OPA's Wasm output is deterministic per-platform but differs
        # across platforms, so CI does not recompile-and-compare. Instead:
        # 1. the committed policy.wasm must hash-match the manifest, and
        # 2. the manifest's regoSha256 must match the committed Rego source
        #    (proving the artifact was built from THIS policy source).
        # Behavioral equivalence native<->Wasm is proven by the parity tests.
        run: |
          WASM_ACTUAL="sha256:$(sha256sum artifacts/policy/policy.wasm | awk '{print $1}')"
          REGO_ACTUAL="sha256:$(sha256sum policies/agent-trust/decision.rego | awk '{print $1}')"
          WASM_EXPECTED=$(node -e "console.log(require('./artifacts/policy/manifest.json').sha256)")
          REGO_EXPECTED=$(node -e "console.log(require('./artifacts/policy/manifest.json').regoSha256 || '')")
          test -n "$REGO_EXPECTED" || { echo "::error::manifest.json missing regoSha256 — rebuild artifacts (pnpm build:policy)"; exit 1; }
          echo "wasm:     $WASM_ACTUAL (manifest: $WASM_EXPECTED)"
          echo "rego src: $REGO_ACTUAL (manifest: $REGO_EXPECTED)"
          test "$WASM_ACTUAL" = "$WASM_EXPECTED" || { echo "::error::Committed policy.wasm does not match its manifest."; exit 1; }
          test "$REGO_ACTUAL" = "$REGO_EXPECTED" || { echo "::error::policy.wasm was not built from the committed decision.rego — rebuild artifacts (pnpm build:policy) and commit."; exit 1; }

      - name: Tests (unit + property + Wasm runtime suite, no Redis required)
        run: pnpm test
        env:
          OPA_BIN: /usr/local/bin/opa

      - name: Redis integration tests (real Redis, SET NX PX atomicity)
        run: pnpm test:integration
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379

      - name: Verify required documents exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/architecture.md
          test -f docs/threat-model.md
          test -f docs/credential-model.md
          test -f docs/trust-model.md
          test -f docs/roadmap.md
          test "$(find docs/adr -name '*.md' | wc -l)" -ge 3

      - name: Verify no key material staged
        run: |
          ! git ls-files | grep -Ei '\.(pem|key|p12|pfx)$'
          ! git ls-files | grep -E '^\.env'
