name: CI

# Phase gate: grows per roadmap phase (docs/roadmap.md#ci-gates).
# Current: repo integrity + typecheck + unit/contract tests + key-material scan.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Typecheck + tests + integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Verify required documents exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f docs/architecture.md
          test -f docs/threat-model.md
          test -f docs/credential-model.md
          test -f docs/trust-model.md
          test -f docs/roadmap.md
          test "$(find docs/adr -name '*.md' | wc -l)" -ge 3

      - name: Verify no key material staged
        run: |
          ! git ls-files | grep -Ei '\.(pem|key|p12|pfx)$'
          ! git ls-files | grep -E '^\.env'
